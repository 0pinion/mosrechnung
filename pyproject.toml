[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosrechnung"
version = "0.1.0"
description = "Einfache native Linux-Anwendung zur Erstellung von PDF-Rechnungen"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "reportlab>=4.0",
    "odfpy>=1.4.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
mosrechnung = "mosrechnung.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
